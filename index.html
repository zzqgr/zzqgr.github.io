<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny - 个人主页</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
color: #fff; min-height: 100vh;
display: flex; align-items: center; justify-content: center;
}
.container { max-width: 480px; text-align: center; padding: 40px 20px; }
.avatar {
width: 120px; height: 120px; border-radius: 50%;
margin: 0 auto 24px;
background: linear-gradient(135deg, #667eea, #764ba2);
display: flex; align-items: center; justify-content: center;
font-size: 48px; box-shadow: 0 8px 32px rgba(102,126,234,.4);
}
h1 { font-size: 28px; margin-bottom: 8px; }
.subtitle { color: #aaa; font-size: 15px; margin-bottom: 32px; }
.links { display: flex; flex-direction: column; gap: 12px; }
.link-btn {
display: block; padding: 14px 24px; border-radius: 12px;
background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
color: #fff; text-decoration: none; font-size: 15px;
transition: all .25s;
}
.link-btn:hover {
background: rgba(255,255,255,.16);
transform: translateY(-2px);
box-shadow: 0 4px 20px rgba(102,126,234,.3);
}
.footer { margin-top: 40px; color: #666; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
<div class="avatar">🐧</div>
<h1>Tiny</h1>
<p class="subtitle">Linux 爱好者 · 折腾达人</p>
<div class="links">
<a class="link-btn" href="#">🐙 GitHub</a>
<a class="link-btn" href="#">🐦 Twitter / X</a>
<a class="link-btn" href="#">📧 Email Me</a>
<a class="link-btn" href="#">📝 Blog</a>
</div>
<div class="footer">© 2026 Tiny. Made with ❤️</div>
</div>
</body>
</html>
